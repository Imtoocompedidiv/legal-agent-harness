name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest cryptography pypdf pyyaml
      - run: python -m pytest -q plugins/contentieux/tests -p no:cacheprovider
      - run: python plugins/contentieux/evaluation/pseudonymisation/evaluer.py --n 200
      - run: python plugins/contentieux/evaluation/pseudonymisation/evaluer_controle.py controle3
      - run: python plugins/contentieux/evaluation/pseudonymisation/evaluer_controle.py controle6
